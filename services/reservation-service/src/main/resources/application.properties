server.port=${SERVER_PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hotel}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:hotel_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:hotel_local}
spring.datasource.hikari.maximum-pool-size=8
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
app.admin.api-key=${ADMIN_API_KEY:}
app.catalog-url=${CATALOG_SERVICE_URL:http://localhost:8081}
app.rate-url=${RATE_SERVICE_URL:http://localhost:8082}
app.payment-url=${PAYMENT_SERVICE_URL:http://localhost:8084}
app.reservation-progress.inactivity-timeout=${RESERVATION_PROGRESS_INACTIVITY_TIMEOUT:PT30M}
app.reservation-progress.sweep-interval-ms=${RESERVATION_PROGRESS_SWEEP_INTERVAL_MS:60000}
